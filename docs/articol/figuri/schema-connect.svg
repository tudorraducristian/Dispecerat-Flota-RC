<svg xmlns="http://www.w3.org/2000/svg" width="252" height="318" viewBox="0 0 252 318" font-family="Times New Roman" font-size="8">
  <!-- Schema logică a proxy-ului: citirea pachetului CONNECT (spec §5.2, CititorConnect și AscultatorMasini). -->
  <defs>
    <marker id="v" viewBox="0 0 10 10" refX="9.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <style>
      .cutie { fill: #eef3f8; stroke: #1f4e79; stroke-width: 0.8; }
      .capat { fill: #fff; stroke: #1f4e79; stroke-width: 0.8; }
      .rau { fill: #fbe9e7; stroke: #b3261e; stroke-width: 0.8; }
      .decizie { fill: #f7efe6; stroke: #c55a11; stroke-width: 0.8; }
      .t { text-anchor: middle; }
      .fir { stroke: #000; stroke-width: 0.7; fill: none; }
      .da { font-style: italic; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#fff"/>

  <rect class="capat" x="14" y="4" width="150" height="18" rx="9"/>
  <text class="t" x="89" y="16">new TCP connection on :1884</text>
  <line class="fir" x1="89" y1="22" x2="89" y2="32" marker-end="url(#v)"/>

  <rect class="cutie" x="14" y="32" width="150" height="16"/>
  <text class="t" x="89" y="43">read byte 1: the packet type</text>
  <line class="fir" x1="89" y1="48" x2="89" y2="56" marker-end="url(#v)"/>

  <polygon class="decizie" points="89,56 135,70 89,84 43,70"/>
  <text class="t" x="89" y="73">type = 0x10?</text>
  <line class="fir" x1="135" y1="70" x2="212" y2="70"/>
  <text class="da" x="139" y="66">no</text>
  <line class="fir" x1="89" y1="84" x2="89" y2="94" marker-end="url(#v)"/>
  <text class="da" x="93" y="91">yes</text>

  <rect class="cutie" x="14" y="94" width="150" height="24"/>
  <text class="t" x="89" y="104">remaining length: 1–4 bytes, 7 bits</text>
  <text class="t" x="89" y="114">each; then read exactly that many</text>
  <line class="fir" x1="89" y1="118" x2="89" y2="128" marker-end="url(#v)"/>

  <rect class="cutie" x="14" y="128" width="150" height="24"/>
  <text class="t" x="89" y="138">check protocol "MQTT" and level 4;</text>
  <text class="t" x="89" y="148">skip the flags and the keepalive</text>
  <line class="fir" x1="89" y1="152" x2="89" y2="160" marker-end="url(#v)"/>

  <polygon class="decizie" points="89,160 135,174 89,188 43,174"/>
  <text class="t" x="89" y="177">well-formed?</text>
  <line class="fir" x1="135" y1="174" x2="212" y2="174"/>
  <text class="da" x="139" y="170">no</text>
  <line class="fir" x1="89" y1="188" x2="89" y2="198" marker-end="url(#v)"/>
  <text class="da" x="93" y="195">yes</text>

  <rect class="cutie" x="14" y="198" width="150" height="16"/>
  <text class="t" x="89" y="209">read the client ID (2-byte length, UTF-8)</text>
  <line class="fir" x1="89" y1="214" x2="89" y2="222" marker-end="url(#v)"/>

  <polygon class="decizie" points="89,222 139,236 89,250 39,236"/>
  <text class="t" x="89" y="239">ID = masina-N?</text>
  <line class="fir" x1="139" y1="236" x2="212" y2="236"/>
  <text class="da" x="142" y="232">no: CONNACK 2</text>
  <line class="fir" x1="89" y1="250" x2="89" y2="260" marker-end="url(#v)"/>
  <text class="da" x="93" y="257">yes</text>

  <rect class="cutie" x="14" y="260" width="150" height="24"/>
  <text class="t" x="89" y="270">open TCP to Mosquitto :1883 and</text>
  <text class="t" x="89" y="280">forward the CONNECT unchanged</text>
  <line class="fir" x1="89" y1="284" x2="89" y2="294" marker-end="url(#v)"/>

  <rect class="capat" x="14" y="294" width="150" height="18" rx="9"/>
  <text class="t" x="89" y="306">4 forwarding threads, 2 per direction</text>

  <!-- Toate refuzurile ajung în același loc. -->
  <line class="fir" x1="212" y1="70" x2="212" y2="288" marker-end="url(#v)"/>
  <circle cx="212" cy="174" r="1.3" fill="#000"/>
  <circle cx="212" cy="236" r="1.3" fill="#000"/>
  <rect class="rau" x="176" y="288" width="72" height="26"/>
  <text class="t" x="212" y="299">close and</text>
  <text class="t" x="212" y="309">log the reason</text>
</svg>
