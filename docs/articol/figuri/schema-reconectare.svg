<svg xmlns="http://www.w3.org/2000/svg" width="252" height="264" viewBox="0 0 252 264" font-family="Times New Roman" font-size="8">
  <!-- Schema logică a radioului mașinii: reconectarea cu pauză care se dublează (spec §4.3, Radio și PauzaReconectare). -->
  <defs>
    <marker id="v" viewBox="0 0 10 10" refX="9.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <style>
      .cutie { fill: #eef3f8; stroke: #1f4e79; stroke-width: 0.8; }
      .capat { fill: #fff; stroke: #1f4e79; stroke-width: 0.8; }
      .decizie { fill: #f7efe6; stroke: #c55a11; stroke-width: 0.8; }
      .t { text-anchor: middle; }
      .fir { stroke: #000; stroke-width: 0.7; fill: none; }
      .da { font-style: italic; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#fff"/>

  <rect class="capat" x="98" y="4" width="140" height="18" rx="9"/>
  <text class="t" x="168" y="16">Radio: not connected</text>
  <line class="fir" x1="168" y1="22" x2="168" y2="32" marker-end="url(#v)"/>

  <rect class="cutie" x="98" y="32" width="140" height="16"/>
  <text class="t" x="168" y="43">n ← 0</text>
  <line class="fir" x1="168" y1="48" x2="168" y2="58" marker-end="url(#v)"/>

  <rect class="cutie" x="98" y="58" width="140" height="26"/>
  <text class="t" x="168" y="69">CONNECT via proxy :1884</text>
  <text class="t" x="168" y="80">timeout: TCP 5 s, CONNACK 5 s</text>
  <line class="fir" x1="168" y1="84" x2="168" y2="94" marker-end="url(#v)"/>

  <polygon class="decizie" points="168,94 218,110 168,126 118,110"/>
  <text class="t" x="168" y="113">CONNACK + online?</text>

  <!-- Nu: pauza, apoi încă o încercare. -->
  <polyline class="fir" points="118,110 48,110 48,122" marker-end="url(#v)"/>
  <text class="da" x="104" y="106">no</text>
  <rect class="cutie" x="10" y="122" width="76" height="40"/>
  <text class="t" x="48" y="133">n ← n + 1</text>
  <text class="t" x="48" y="145">wait min(30, 2ⁿ⁻¹) s</text>
  <text class="t" x="48" y="157">× random 0.8–1.2</text>
  <line class="fir" x1="10" y1="142" x2="4" y2="142"/>
  <circle cx="4" cy="142" r="1.3" fill="#000"/>
  <polyline class="fir" points="4,258 4,71 98,71" marker-end="url(#v)"/>

  <!-- Da: numărătoarea de la capăt, apoi coada. -->
  <line class="fir" x1="168" y1="126" x2="168" y2="138" marker-end="url(#v)"/>
  <text class="da" x="172" y="134">yes</text>
  <rect class="cutie" x="98" y="138" width="140" height="16"/>
  <text class="t" x="168" y="149">n ← 0 (counter reset)</text>
  <line class="fir" x1="168" y1="154" x2="168" y2="164" marker-end="url(#v)"/>

  <rect class="cutie" x="98" y="164" width="140" height="26"/>
  <text class="t" x="168" y="175">publish from the FIFO queue:</text>
  <text class="t" x="168" y="186">buffered messages first, then live</text>
  <line class="fir" x1="168" y1="190" x2="168" y2="198" marker-end="url(#v)"/>

  <polygon class="decizie" points="168,198 218,214 168,230 118,214"/>
  <text class="t" x="168" y="217">connection lost?</text>
  <polyline class="fir" points="218,214 246,214 246,177 238,177" marker-end="url(#v)"/>
  <text class="da" x="222" y="210">no</text>
  <polyline class="fir" points="168,230 168,258 4,258"/>
  <text class="da" x="172" y="242">yes</text>
</svg>
